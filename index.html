<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#4f46e5">
  <title>Aplikasi Pertamaku</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Halaman login / daftar (tampil kalau belum login) -->
  <main id="halaman-login" class="kartu" hidden>
    <h1 id="judul-form">Masuk</h1>
    <form id="form-auth">
      <input id="email" type="email" placeholder="Email" autocomplete="email" required>
      <input id="password" type="password" placeholder="Password (minimal 6 karakter)" autocomplete="current-password" required>
      <button type="submit" id="tombol-kirim">Masuk</button>
    </form>
    <p id="error" class="error" role="alert"></p>
    <p class="ganti">
      <span id="teks-ganti">Belum punya akun?</span>
      <a href="#" id="link-ganti">Daftar</a>
    </p>
  </main>

  <!-- Aplikasi (tampil kalau sudah login) -->
  <div id="halaman-app" hidden>
    <nav class="tab">
      <button id="tab-chat" class="aktif">Chat</button>
      <button id="tab-profil">Profil</button>
    </nav>

    <!-- Chat -->
    <section id="bagian-chat" class="kartu chat">
      <h2>🌍 World</h2>
      <div id="daftar-pesan" class="daftar-pesan" aria-live="polite"></div>
      <p id="info-chat" class="status"></p>
      <form id="form-chat" class="form-chat">
       <textarea id="teks-chat" rows="2" placeholder="Tulis pesan..." maxlength="500" required></textarea>
        <button type="submit" id="tombol-chat">Kirim</button>
      </form>
    </section>

    <!-- Profil -->
    <section id="bagian-profil" class="kartu" hidden>
      <h1>Profil Saya</h1>
      <form id="form-profil" class="rata-kiri">
        <label for="profil-email">Email</label>
        <input id="profil-email" type="email" readonly>

        <label for="profil-nama">Nama</label>
        <input id="profil-nama" type="text" placeholder="Nama lengkap" maxlength="60" autocomplete="name" required>

        <label for="profil-hp">No. HP</label>
        <input id="profil-hp" type="tel" placeholder="08xxxxxxxxxx" maxlength="20" autocomplete="tel" inputmode="tel" required>

        <button type="submit" id="tombol-simpan">Simpan</button>
      </form>
      <p id="status-profil" class="status" role="status"></p>
      <button id="tombol-keluar" class="sekunder">Keluar</button>
    </section>
  </div>

  <p id="memuat">Memuat...</p>

  <script type="module" src="app.js"></script>
</body>
</html>
